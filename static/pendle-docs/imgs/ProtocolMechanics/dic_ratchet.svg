<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="440" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="360" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">The ratchet: rate follows the confirmed high-water-mark</text>

  <!-- axes -->
  <line x1="90" y1="360" x2="670" y2="360" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="90" y1="360" x2="90" y2="70" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="405" text-anchor="middle" font-size="13" fill="#475569">Time →</text>
  <text x="34" y="215" text-anchor="middle" font-size="13" fill="#475569" transform="rotate(-90 34 215)">TVL / rate level →</text>

  <!-- confirmed high-water-mark: non-decreasing staircase -->
  <polyline fill="none" stroke="#16a34a" stroke-width="3"
    points="90,300 140,300 140,270 190,270 190,220 280,220 280,210 330,210 330,170 425,170 425,150 520,150 520,120 620,120 620,110 660,110"/>

  <!-- live TVL: jagged, dips below the mark -->
  <polyline fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="1 0" opacity="0.9"
    points="90,300 140,270 190,220 235,250 280,210 330,170 380,200 425,150 475,185 520,120 570,140 620,110 660,115"/>

  <!-- dip callout -->
  <circle cx="235" cy="250" r="4" fill="#2563eb"/>
  <line x1="235" y1="250" x2="235" y2="220" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="245" y="288" font-size="11.5" fill="#475569">TVL dips…</text>
  <text x="245" y="303" font-size="11.5" fill="#16a34a" font-weight="600">…rate holds</text>

  <!-- step-up callout -->
  <line x1="520" y1="120" x2="520" y2="150" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="450" y="98" font-size="11.5" fill="#16a34a" font-weight="600">sustained new high</text>
  <text x="470" y="113" font-size="11.5" fill="#475569">lifts the rate</text>

  <!-- legend -->
  <rect x="150" y="58" width="18" height="4" rx="2" fill="#16a34a"/>
  <text x="176" y="63" font-size="12.5" fill="#334155">Confirmed high-water-mark (drives reward APR)</text>
  <line x1="150" y1="80" x2="168" y2="80" stroke="#2563eb" stroke-width="2"/>
  <text x="176" y="84" font-size="12.5" fill="#334155">Live market TVL</text>
</svg>
