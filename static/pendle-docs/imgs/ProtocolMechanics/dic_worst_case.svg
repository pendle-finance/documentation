<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="440" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="360" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Worst-case budget sits at the joint-spend peak</text>

  <!-- unfunded region beyond the Cap -->
  <rect x="603" y="70" width="57" height="290" fill="#e2e8f0" opacity="0.6"/>
  <text x="631" y="250" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90 631 250)">unfunded</text>

  <!-- axes -->
  <line x1="90" y1="360" x2="670" y2="360" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="90" y1="360" x2="90" y2="70" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90" y="382" text-anchor="middle" font-size="12" fill="#64748b">0</text>
  <text x="660" y="382" text-anchor="middle" font-size="12" fill="#64748b">End Target</text>
  <text x="380" y="410" text-anchor="middle" font-size="13" fill="#475569">Market TVL (SY units) →</text>
  <text x="34" y="215" text-anchor="middle" font-size="13" fill="#475569" transform="rotate(-90 34 215)">Joint (YT + PT) spend →</text>

  <!-- joint-spend hump, peak at h* = 0.75 * End Target -->
  <path d="M 90 360 C 180 320, 300 175, 375 138 C 445 105, 480 105, 517 110 C 570 117, 620 129, 660 138"
        fill="none" stroke="#7c3aed" stroke-width="3"/>

  <!-- worst-case level line -->
  <line x1="90" y1="110" x2="517" y2="110" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="98" y="102" font-size="12" fill="#6d28d9" font-weight="600">max joint spend  →  sets Total budget</text>

  <!-- h* marker -->
  <line x1="517" y1="110" x2="517" y2="360" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="517" cy="110" r="4.5" fill="#7c3aed"/>
  <text x="517" y="378" text-anchor="middle" font-size="12" fill="#6d28d9" font-weight="600">h*</text>
  <text x="517" y="392" text-anchor="middle" font-size="10.5" fill="#64748b">worst-case TVL</text>

  <!-- Cap marker -->
  <line x1="603" y1="70" x2="603" y2="360" stroke="#0f172a" stroke-width="1.4" stroke-dasharray="2 3"/>
  <text x="603" y="62" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="600">Funded Cap</text>
</svg>
